<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        eco: {
                            black: '#030712',
                            dark: '#071A17',
                            green: '#22C55E',
                            cyan: '#06B6D4',
                            blue: '#3B82F6',
                            white: '#F8FAFC'
                        }
                    },

                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>


    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Register | RecycleX</title>


    <link
            rel="icon"
            type="image/svg+xml"
            href="/images/logo.svg"
    >


    <!-- Existing CSS -->

    <link
            rel="stylesheet"
            href="/css/tailwind.css"
    >

    <link
            rel="stylesheet"
            href="/css/style.css"
    >

    <link
            rel="stylesheet"
            href="/css/frontend-polish.css"
    >


    <!-- Google Fonts -->

    <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
            rel="stylesheet"
    >

</head>


<body
        class="
        min-h-screen

        flex
        items-center
        justify-center

        bg-black

        px-4
        py-6

        font-sans

        text-white

        overflow-y-auto

        bg-[radial-gradient(circle_at_15%_20%,rgba(34,197,94,0.10),transparent_28%),radial-gradient(circle_at_85%_25%,rgba(59,130,246,0.10),transparent_30%),radial-gradient(circle_at_50%_100%,rgba(6,182,212,0.08),transparent_35%)]
    "
>


<!-- =====================================================
     REGISTER CARD
====================================================== -->

<div
        class="
            relative

            w-full
            max-w-md

            rounded-2xl

            border
            border-slate-700/60

            bg-slate-950/85

            backdrop-blur-xl

            px-6
            py-5

            sm:px-7
            sm:py-6

            shadow-[0_20px_60px_rgba(0,0,0,0.55)]

            transition-all
            duration-300

            hover:border-emerald-500/30

            hover:shadow-[0_25px_70px_rgba(34,197,94,0.10)]
        "
>


    <!-- TOP GLOW -->

    <div
            class="
                pointer-events-none

                absolute
                left-1/2
                top-0

                h-px
                w-3/4

                -translate-x-1/2

                bg-gradient-to-r
                from-transparent
                via-cyan-400/70
                to-transparent
            "
    ></div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="text-center">


        <!-- LOGO -->

        <div
                class="
                    mx-auto
                    mb-3

                    flex
                    h-11
                    w-11

                    items-center
                    justify-center

                    rounded-xl

                    bg-gradient-to-br
                    from-emerald-500
                    via-cyan-400
                    to-blue-500

                    shadow-lg
                    shadow-cyan-500/15

                    transition-all
                    duration-300

                    hover:scale-105
                    hover:shadow-cyan-400/30
                "
        >

            <img
                    src="/images/logo.svg"
                    alt="RecycleX Logo"

                    class="
                        h-6
                        w-6
                    "
            >

        </div>


        <!-- TITLE -->

        <h1
                class="
                    font-display

                    text-2xl
                    sm:text-3xl

                    font-bold

                    tracking-tight

                    text-white
                "
        >

            Join

            <span
                    class="
                        bg-gradient-to-r
                        from-cyan-400
                        via-blue-400
                        to-emerald-400

                        bg-clip-text
                        text-transparent
                    "
            >
                    RecycleX
                </span>

        </h1>


        <!-- SUBTITLE -->

        <p
                class="
                    mt-1

                    text-xs
                    sm:text-sm

                    text-slate-400
                "
        >
            Become part of a cleaner city
        </p>


        <!-- =================================================
             TAGLINE
        ================================================== -->

        <div
                class="
                    mt-4

                    flex
                    justify-center
                "
        >

            <div
                    class="
                        inline-flex
                        items-center
                        gap-2

                        rounded-full

                        border
                        border-cyan-400/20

                        bg-cyan-400/5

                        px-3
                        py-1.5

                        text-[11px]
                        font-medium

                        text-cyan-300

                        shadow-[0_0_20px_rgba(6,182,212,0.05)]

                        transition-all
                        duration-300

                        hover:border-cyan-400/40

                        hover:bg-cyan-400/10

                        hover:text-cyan-200

                        hover:shadow-[0_0_25px_rgba(6,182,212,0.12)]

                        hover:-translate-y-0.5
                    "
            >

                    <span>
                        🌱
                    </span>

                <span>
                        Small actions. Cleaner cities. A greener future.
                    </span>

            </div>

        </div>

    </div>


    <!-- =====================================================
         REGISTER FORM
    ====================================================== -->

    <form
            id="registerForm"

            class="
                mt-5
            "
    >


        <!-- =================================================
             NAME
        ================================================== -->

        <div class="mb-3.5">

            <label
                    for="name"

                    class="
                        mb-1.5

                        block

                        text-xs
                        font-semibold

                        text-slate-300
                    "
            >
                Name
            </label>


            <input
                    id="name"

                    type="text"

                    placeholder="Enter your name"

                    autocomplete="name"

                    required

                    class="
                        w-full

                        rounded-lg

                        border
                        border-slate-700

                        bg-slate-900/80

                        px-3
                        py-2.5

                        text-sm

                        text-white

                        placeholder:text-slate-500

                        outline-none

                        shadow-inner
                        shadow-black/20

                        transition-all
                        duration-200

                        hover:border-cyan-400/40

                        hover:bg-slate-900

                        focus:border-cyan-400

                        focus:bg-slate-900

                        focus:ring-2
                        focus:ring-cyan-400/10

                        focus:shadow-[0_0_20px_rgba(6,182,212,0.08)]
                    "
            >

        </div>


        <!-- =================================================
             EMAIL
        ================================================== -->

        <div class="mb-3.5">

            <label
                    for="email"

                    class="
                        mb-1.5

                        block

                        text-xs
                        font-semibold

                        text-slate-300
                    "
            >
                Email
            </label>


            <input
                    id="email"

                    type="email"

                    placeholder="Enter your email"

                    autocomplete="email"

                    required

                    class="
                        w-full

                        rounded-lg

                        border
                        border-slate-700

                        bg-slate-900/80

                        px-3
                        py-2.5

                        text-sm

                        text-white

                        placeholder:text-slate-500

                        outline-none

                        shadow-inner
                        shadow-black/20

                        transition-all
                        duration-200

                        hover:border-blue-400/40

                        hover:bg-slate-900

                        focus:border-blue-400

                        focus:bg-slate-900

                        focus:ring-2
                        focus:ring-blue-400/10

                        focus:shadow-[0_0_20px_rgba(59,130,246,0.08)]
                    "
            >

        </div>


        <!-- =================================================
             PASSWORD
        ================================================== -->

        <div class="mb-3.5">

            <label
                    for="password"

                    class="
                        mb-1.5

                        block

                        text-xs
                        font-semibold

                        text-slate-300
                    "
            >
                Password
            </label>


            <input
                    id="password"

                    type="password"

                    placeholder="Create a password"

                    autocomplete="new-password"

                    required

                    class="
                        w-full

                        rounded-lg

                        border
                        border-slate-700

                        bg-slate-900/80

                        px-3
                        py-2.5

                        text-sm

                        text-white

                        placeholder:text-slate-500

                        outline-none

                        shadow-inner
                        shadow-black/20

                        transition-all
                        duration-200

                        hover:border-emerald-400/40

                        hover:bg-slate-900

                        focus:border-emerald-400

                        focus:bg-slate-900

                        focus:ring-2
                        focus:ring-emerald-400/10

                        focus:shadow-[0_0_20px_rgba(34,197,94,0.08)]
                    "
            >

        </div>


        <!-- =================================================
             ROLE
        ================================================== -->

        <div class="mb-5">

            <label
                    for="role"

                    class="
                        mb-1.5

                        block

                        text-xs
                        font-semibold

                        text-slate-300
                    "
            >
                Role
            </label>


            <div class="relative">


                <select
                        id="role"

                        class="
                            w-full

                            appearance-none

                            cursor-pointer

                            rounded-lg

                            border
                            border-slate-700

                            bg-slate-900

                            px-3
                            py-2.5
                            pr-9

                            text-sm

                            font-medium

                            text-white

                            outline-none

                            transition-all
                            duration-200

                            hover:border-emerald-400/40

                            hover:bg-slate-800

                            focus:border-emerald-400

                            focus:ring-2
                            focus:ring-emerald-400/10
                        "
                >

                    <option
                            value="USER"
                            class="bg-slate-900 text-white"
                    >
                        Citizen
                    </option>

                    <option
                            value="CLEANING_WORKER"
                            class="bg-slate-900 text-white"
                    >
                        Cleaning Worker
                    </option>

                    <option
                            value="RECYCLING_WORKER"
                            class="bg-slate-900 text-white"
                    >
                        Recycling Worker
                    </option>

                </select>


                <!-- ARROW -->

                <div
                        class="
                            pointer-events-none

                            absolute
                            right-3
                            top-1/2

                            -translate-y-1/2

                            text-cyan-400
                        "
                >

                    <svg
                            xmlns="http://www.w3.org/2000/svg"

                            class="
                                h-4
                                w-4
                            "

                            fill="none"

                            viewBox="0 0 24 24"

                            stroke="currentColor"

                            stroke-width="2"
                    >

                        <path
                                stroke-linecap="round"
                                stroke-linejoin="round"

                                d="m19 9-7 7-7-7"
                        />

                    </svg>

                </div>

            </div>

        </div>


        <!-- =================================================
             CREATE ACCOUNT BUTTON
        ================================================== -->

        <button
                type="submit"

                class="
                    group

                    relative

                    w-full

                    overflow-hidden

                    rounded-lg

                    bg-gradient-to-r
                    from-emerald-500
                    via-cyan-500
                    to-blue-500

                    px-4
                    py-2.5

                    text-xs
                    sm:text-sm

                    font-bold

                    tracking-wider

                    text-white

                    shadow-lg
                    shadow-cyan-500/15

                    transition-all
                    duration-300

                    hover:-translate-y-0.5

                    hover:from-emerald-400
                    hover:via-cyan-400
                    hover:to-blue-400

                    hover:shadow-xl
                    hover:shadow-cyan-400/20

                    active:translate-y-0

                    focus:outline-none

                    focus:ring-2
                    focus:ring-cyan-400/30
                "
        >

            <!-- SHINE -->

            <span
                    class="
                        absolute
                        inset-0

                        -translate-x-full

                        bg-gradient-to-r
                        from-transparent
                        via-white/20
                        to-transparent

                        transition-transform
                        duration-700

                        group-hover:translate-x-full
                    "
            ></span>


            <span class="relative">
                    CREATE ACCOUNT
                </span>

        </button>


        <!-- MESSAGE -->

        <p
                id="message"

                class="
                    mt-3

                    min-h-4

                    text-center

                    text-xs
                    font-medium

                    text-slate-400
                "
        ></p>


    </form>

</div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="/js/api.js"></script>

<script src="/js/common.js"></script>

<script src="/js/register.js"></script>


</body>

</html>
