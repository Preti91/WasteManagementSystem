<!DOCTYPE html>

<html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        green: {
                            300: '#8EC5FF',
                            400: '#4F9DFF',
                            500: '#2F80ED',
                            600: '#1D5FCC'
                        },

                        cyan: {
                            300: '#7DD3FC',
                            400: '#38BDF8',
                            500: '#0EA5E9'
                        },

                        amber: {
                            300: '#FFD98A',
                            400: '#FFC145',
                            500: '#E8952A'
                        }

                    },

                    fontFamily: {

                        sans: ['"DM Sans"', 'sans-serif'],

                        display: [
                            '"Space Grotesk"',
                            'sans-serif'
                        ]

                    }

                }

            }

        };

    </script>


    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width,initial-scale=1"
    >


    <title>
        WasteBot | RecycleX
    </title>
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">



    <link
            rel="stylesheet"
            href="/css/tailwind.css"
    >

    <link
            rel="stylesheet"
            href="/css/style.css"
    >

    <link rel="stylesheet" href="/css/frontend-polish.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="glass">

    <div
            class="
        max-w-7xl
        mx-auto
        px-6
        py-4
        "
    >

        <a
                href="/user-dashboard.html"
                class="
            text-green-400
            font-bold
            "
        >

            <span class="brand-mark" aria-hidden="true"></span> RECYCLEX

        </a>

    </div>

</nav>



<!-- ================= CHATBOT ================= -->

<main
        class="
    max-w-4xl
    mx-auto
    px-5
    py-10
    "
>

    <div
            class="
        glass
        rounded-3xl
        p-5
        "
    >


        <!-- HEADER -->

        <div
                class="
            flex
            items-center
            gap-4
            border-b
            border-green-400/10
            pb-5
            "
        >

            <div
                    class="
                w-14
                h-14
                rounded-full
                bg-green-400/10
                flex
                items-center
                justify-center
                text-3xl
                "
            >

                🤖

            </div>


            <div>

                <h1
                        class="
                    text-2xl
                    font-bold
                    "
                >

                    WasteBot

                </h1>


                <p class="text-green-400 text-sm">

                    ● Online

                </p>

            </div>

        </div>



        <!-- ================= MESSAGES ================= -->

        <div
                id="messages"
                class="
            h-[450px]
            overflow-y-auto
            py-5
            "
        >

            <div
                    class="
                glass
                rounded-2xl
                p-4
                max-w-[80%]
                mb-4
                "
            >

                Hi! 👋 I'm WasteBot.

                <br><br>

                I can help you with:

                <br>

                • Garbage reporting
                <br>
                • Recycling
                <br>
                • Waste segregation
                <br>
                • Waste classification
                <br>
                • Garbage collection
                <br>
                • Rewards
                <br>
                • Report status

                <br><br>

                Ask me anything about
                waste management!

            </div>

        </div>



        <!-- ================= CHAT FORM ================= -->

        <form
                id="chatForm"
                class="
            flex
            gap-3
            "
        >

            <input
                    id="message"
                    class="eco-input"
                    placeholder="Ask WasteBot..."
                    autocomplete="off"
                    required
            >


            <button
                    type="submit"
                    id="sendButton"
                    class="eco-button"
            >

                Send

            </button>

        </form>

        <div class="eco-tagline-center">
            <span class="eco-tagline">Small actions. Cleaner cities. A greener future.</span>
        </div>

    </div>

</main>



<!-- ================= JAVASCRIPT ================= -->

<script src="/js/api.js"></script>

<script src="/js/common.js"></script>

<script src="/js/chatbot.js"></script>


</body>

</html>
